service: cs2032-candidatos
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    CANDIDATOS_TABLE: t_candidatos-${sls:stage}
    TOKENS_TABLE: t_tokens_acceso-${sls:stage}
    BUCKET_CVS: !Ref BucketCVs
  iam:
    role: arn:aws:iam::816193343783:role/LabRole

functions:
  listarCandidatos:
    handler: handler.listar_candidatos
    events:
      - http:
          path: candidatos
          method: get
          cors: true

  crearCandidato:
    handler: handler.crear_candidato
    events:
      - http:
          path: candidatos
          method: post
          cors: true

  modificarCandidato:
    handler: handler.modificar_candidato
    events:
      - http:
          path: candidatos/{candidato_id}
          method: put
          cors: true

  buscarCandidato:
    handler: handler.buscar_candidato
    events:
      - http:
          path: candidatos/{candidato_id}
          method: get
          cors: true

  eliminarCandidato:
    handler: handler.eliminar_candidato
    events:
      - http:
          path: candidatos/{candidato_id}
          method: delete
          cors: true

  generarUrlSubidaCV:
    handler: handler.generar_url_subida
    events:
      - http:
          path: candidatos/{candidato_id}/cv-url
          method: post
          cors: true

resources:
  Resources:
    BucketCVs:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cs2032-candidatos-cv-${aws:accountId}-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - PUT
              AllowedHeaders:
                - '*'
              MaxAge: 300
    TablaCandidatos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_candidatos-${sls:stage}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: candidato_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: candidato_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
